
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnHub - Login</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef2ff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;color:#172554}
.card{background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 35px #0001;width:100%;max-width:380px;text-align:center}
h1{color:#3155d9;margin-top:0}
input{width:100%;padding:13px;margin:8px 0;border:1px solid #d1d5db;border-radius:9px}
button{width:100%;padding:13px;background:#3155d9;color:white;border:0;border-radius:9px;margin-top:12px;font-size:16px;cursor:pointer}
.link{color:#3155d9;cursor:pointer}
#msg{overflow-wrap:anywhere;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="card">
<h1>EarnHub</h1>
<p>Welcome! Sign in or create an account.</p>

<form id="login">
<h3>Login</h3>
<input id="loginEmail" type="email" placeholder="Email address" required>
<input id="loginPassword" type="password" placeholder="Password" required>
<button type="submit" id="loginBtn">Login</button>
</form>

<p>New here? <span class="link" id="toggle" role="button" tabindex="0">Create an account</span></p>

<form id="signup" hidden>
<h3>Sign Up</h3>
<input id="name" placeholder="Your name" required>
<input id="email" type="email" placeholder="Email address" required>
<input id="password" type="password" minlength="6" placeholder="Create a password (min. 6 characters)" required>
<button type="submit" id="register">Sign Up</button>
</form>

<p id="msg" role="status"></p>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://xzghakgbijoserpsoery.supabase.co";
const SUPABASE_KEY = "sb_publishable_GPqGktzKZRQpCBCph-YRyQ_PtK5YH6_";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const msg = document.getElementById("msg");
const signup = document.getElementById("signup");

document.getElementById("toggle").onclick = () => {
  signup.hidden = !signup.hidden;
  msg.textContent = "";
};

document.getElementById("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  msg.textContent = "Logging in...";
  try {
    const { error } = await supabase.auth.signInWithPassword({
      email: document.getElementById("loginEmail").value.trim(),
      password: document.getElementById("loginPassword").value
    });
    if (error) throw error;
    msg.textContent = "Login successful!";
  } catch (err) {
    msg.textContent = err.message || "Login failed.";
  } finally {
    btn.disabled = false;
  }
});

signup.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("register");
  btn.disabled = true;
  msg.textContent = "Creating account...";
  try {
    const { data, error } = await supabase.auth.signUp({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
      options: {
        data: { full_name: document.getElementById("name").value.trim() }
      }
    });
    if (error) throw error;
    msg.textContent = data.session
      ? "Account created successfully!"
      : "Account submitted! Check your email for confirmation.";
  } catch (err) {
    msg.textContent = err.message || "Sign up failed.";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
