<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnHub - Login</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f4ff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:white;padding:28px;border-radius:16px;box-shadow:0 5px 25px #0001;width:300px;text-align:center}h1{color:#2448c6}input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:12px;background:#3155d9;color:white;border:0;border-radius:8px;margin-top:12px;font-size:16px}a{color:#3155d9;cursor:pointer}
</style>
</head>
<body>
<div class="card"><h1>EarnHub</h1><p>Welcome! Sign in or create an account.</p>
<form id="login"><h3>Login</h3><input type="email" placeholder="Email address" required><input type="password" placeholder="Password" required><button type="submit">Login</button></form>
<p>New here? <a id="toggle">Create an account</a></p>
<div id="signup" hidden><h3>Sign Up</h3><input id="name" placeholder="Your name"><input id="email" type="email" placeholder="Email address"><input id="password" type="password" placeholder="Create a password"><button id="register" type="button">Sign Up</button></div><p id="msg"></p></div>
<script>
document.getElementById("toggle").onclick=()=>document.getElementById("signup").hidden=!document.getElementById("signup").hidden;
document.getElementById("login").onsubmit=e=>{e.preventDefault();document.getElementById("msg").textContent="Authentication setup required."};
document.getElementById("register").onclick=()=>document.getElementById("msg").textContent="Connect Supabase to create accounts.";
</script></body></html>
