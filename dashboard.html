
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnHub Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef2ff;color:#172554}
header{background:#3155d9;color:white;padding:20px}
header h2{margin:0}
main{max-width:700px;margin:25px auto;padding:15px}
.card{background:white;border-radius:15px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #0001}
button{background:#3155d9;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
#logout{background:#dc2626}
.muted{color:#64748b;overflow-wrap:anywhere}
.task{border:1px solid #dbeafe;border-radius:10px;padding:15px;margin:12px 0}
.reward{color:#166534;font-weight:bold}
#taskMessage{white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h2>EarnHub</h2>
  <p>Your earning dashboard</p>
</header>

<main>
  <div class="card">
    <h2>Welcome to EarnHub!</h2>
    <p id="status">Checking your account...</p>
    <p class="muted" id="email"></p>
    <button id="logout">Logout</button>
  </div>

  <div class="card">
    <h3>My Balance</h3>
    <h2 id="balance">0 points</h2>
    <p class="muted">Points are displayed here. They are not cash or withdrawable earnings.</p>
  </div>

  <div class="card">
    <h3>Available Tasks</h3>
    <p id="taskMessage">Loading tasks...</p>
    <div id="taskList"></div>
  </div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://xzghakgbijoserpsoery.supabase.co",
  "sb_publishable_GPqGktzKZRQpCBCph-YRyQ_PtK5YH6_"
);

const status = document.getElementById("status");
const email = document.getElementById("email");
const taskMessage = document.getElementById("taskMessage");
const taskList = document.getElementById("taskList");

const { data, error } = await supabase.auth.getSession();

if (error || !data.session) {
  status.textContent = "Please log in to access your dashboard.";
  setTimeout(() => window.location.replace("./auth.html"), 1500);
} else {
  status.textContent = "You are logged in successfully!";
  email.textContent = "Email: " + data.session.user.email;

  const { data: profile, error: profileError } = await supabase
    .from("profiles")
    .select("points")
    .eq("id", data.session.user.id)
    .maybeSingle();

  if (!profileError && profile) {
    document.getElementById("balance").textContent =
      Number(profile.points) + " points";
  }

  const { data: tasks, error: taskError } = await supabase
    .from("tasks")
    .select("id, title, description, reward_points")
    .eq("is_active", true)
    .order("id", { ascending: true });

  if (taskError) {
    taskMessage.textContent =
      "Could not load tasks. Please check the Supabase tasks table permissions.";
  } else if (!tasks || tasks.length === 0) {
    taskMessage.textContent = "No active tasks available yet.";
  } else {
    taskMessage.textContent = "";
    tasks.forEach(task => {
      const item = document.createElement("div");
      item.className = "task";

      const title = document.createElement("h4");
      title.textContent = task.title;

      const description = document.createElement("p");
      description.textContent = task.description || "";

      const reward = document.createElement("p");
      reward.className = "reward";
      reward.textContent = "Reward: " + task.reward_points + " points";

      item.append(title, description, reward);
      taskList.appendChild(item);
    });
  }
}

document.getElementById("logout").addEventListener("click", async () => {
  await supabase.auth.signOut();
  window.location.replace("./auth.html");
});
</script>
</body>
</html>
