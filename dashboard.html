
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnHub Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef2ff;color:#172554}
header{background:#3155d9;color:white;padding:20px}
header h2{margin:0}
main{max-width:700px;margin:25px auto;padding:15px}
.card{background:white;border-radius:15px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #0001}
button{background:#3155d9;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
#logout{background:#dc2626}
.muted{color:#64748b;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <h2>EarnHub</h2>
  <p>Your earning dashboard</p>
</header>

<main>
  <div class="card">
    <h2>Welcome to EarnHub!</h2>
    <p id="status">Checking your account...</p>
    <p class="muted" id="email"></p>
    <button id="logout">Logout</button>
  </div>

  <div class="card">
    <h3>My Balance</h3>
    <h2>$0.00</h2>
    <p class="muted">Your earning balance will appear here.</p>
  </div>

  <div class="card">
    <h3>Available Tasks</h3>
    <p>Tasks will be added here later.</p>
  </div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://xzghakgbijoserpsoery.supabase.co",
  "sb_publishable_GPqGktzKZRQpCBCph-YRyQ_PtK5YH6_"
);

const status = document.getElementById("status");
const email = document.getElementById("email");

const { data, error } = await supabase.auth.getSession();

if (error || !data.session) {
  status.textContent = "Please log in to access your dashboard.";
  setTimeout(() => {
    window.location.replace("./auth.html");
  }, 1500);
} else {
  status.textContent = "You are logged in successfully!";
  email.textContent = "Email: " + data.session.user.email;
}

document.getElementById("logout").addEventListener("click", async () => {
  await supabase.auth.signOut();
  window.location.replace("./auth.html");
});
</script>
</body>
</html>
